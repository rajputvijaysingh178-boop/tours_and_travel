<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Tours & Travels</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#packages">Packages</a>
            <a href="#login">Login</a>
            <a href="#register">Register</a>
        </nav>
    </header>

    <main>

        <!-- Home -->
        <section id="home" class="hero">
            <div>
                <h1>Explore Your Next Destination</h1>
                <p>Discover amazing destinations and plan your perfect trip.</p>
                <button onclick="scrollToPackages()">Explore Packages</button>
            </div>
        </section>

        <!-- Packages -->
        <section id="packages" class="section">
            <h2>Available Tour Packages</h2>

            <div id="package-container" class="package-container">
                <p>Loading packages...</p>
            </div>
        </section>

        <!-- Package Details -->
        <section id="package-details" class="section hidden">
            <h2>Package Details</h2>

            <div id="details-container"></div>
        </section>

        <!-- Login -->
        <section id="login" class="form-section">
            <h2>Customer Login</h2>

            <form id="login-form">
                <input
                    type="email"
                    id="login-email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p id="login-message"></p>
        </section>

        <!-- Register -->
        <section id="register" class="form-section">
            <h2>Create Account</h2>

            <form id="register-form">

                <input
                    type="text"
                    id="register-name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="register-email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="register-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Register</button>

            </form>

            <p id="register-message"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 Tours & Travels Management System</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
